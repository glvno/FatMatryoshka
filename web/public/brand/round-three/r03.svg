<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 2111.28 952.32" role="img" aria-label="FatMatryoshka — Full-width stack">
<title>FatMatryoshka — Full-width stack</title>
<desc>Roboto Flex. Teal F, M and a full-cap-height footless numeral 1 forming the R stem in MATRYOSHKA read FM1. The R bowl and diagonal leg remain in the regular text color. Both Ts and the K retain their original font shapes. Both words fill the same width. The oversized FAT turns the name into a solid graphic block.</desc>
