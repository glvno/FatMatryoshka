<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 3126.79 316" role="img" aria-label="FatMatryoshka — Wide FAT / narrow MATRYOSHKA">
<title>FatMatryoshka — Wide FAT / narrow MATRYOSHKA</title>
<desc>Roboto Flex. Teal F, M and a full-cap-height footless numeral 1 forming the R stem in MATRYOSHKA read FM1. The R bowl and diagonal leg remain in the regular text color. Both Ts and the K retain their original font shapes. Same cap height. Width and weight give FAT its own voice while pulling the long name inward.</desc>
