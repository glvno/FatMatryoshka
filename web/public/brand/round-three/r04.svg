<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 2213.78 859.51" role="img" aria-label="FatMatryoshka — Compact stack">
<title>FatMatryoshka — Compact stack</title>
<desc>Roboto Flex. Teal F, M and a full-cap-height footless numeral 1 forming the R stem in MATRYOSHKA read FM1. The R bowl and diagonal leg remain in the regular text color. Both Ts and the K retain their original font shapes. A centered FAT at 72% of the lower line’s width. More breathing room, less dominance.</desc>
