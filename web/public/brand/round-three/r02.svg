<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 3266.78 421" role="img" aria-label="FatMatryoshka — Big FAT / small MATRYOSHKA">
<title>FatMatryoshka — Big FAT / small MATRYOSHKA</title>
<desc>Roboto Flex. Teal F, M and a full-cap-height footless numeral 1 forming the R stem in MATRYOSHKA read FM1. The R bowl and diagonal leg remain in the regular text color. Both Ts and the K retain their original font shapes. A taller FAT and the narrowest MATRYOSHKA. A compact horizontal signature with a shared baseline.</desc>
